<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 864" width="1536" height="864" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Filtro para remover fundo claro/branco (#fefefe / #ffffff) e torná-lo transparente -->
    <filter id="remove-white-bg-5e" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%">
      <feImage xlink:href="/src/assets/logo-5e-vetor-master-14jul26-04e42.png" result="source" width="1536" height="864" />
      <feColorMatrix in="source" type="matrix"
        values="0.333 0.333 0.333 0 0
                0.333 0.333 0.333 0 0
                0.333 0.333 0.333 0 0
                -2.0  -2.0  -2.0  0 5.6"
        result="alpha-mask" />
      <feComposite in="source" in2="alpha-mask" operator="in" />
    </filter>
  </defs>

  <g id="master-logo-horizontal">
    <image
      href="/src/assets/logo-5e-vetor-master-14jul26-04e42.png"
      xlink:href="/src/assets/logo-5e-vetor-master-14jul26-04e42.png"
      x="0"
      y="0"
      width="1536"
      height="864"
      style="mix-blend-mode: multiply;"
    />
  </g>
</svg>
